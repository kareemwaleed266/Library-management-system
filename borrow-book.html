<!-- borrow-book.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Borrow Book | LibraryMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- Navbar -->
    <nav class="bg-white shadow-md">
      <div class="max-w-7xl mx-auto px-4">
        <div class="flex justify-between items-center h-16">
          <div class="flex items-center">
            <img
              src="https://cdn-icons-png.flaticon.com/512/3145/3145765.png"
              alt="Logo"
              class="h-10 w-10 mr-2"
            />
            <span class="font-bold text-xl text-blue-600">LibraryMS</span>
          </div>
          <div class="flex space-x-4">
            <a href="index.html" class="text-gray-700 hover:text-blue-600"
              >Home</a
            >
            <a href="books.html" class="text-gray-700 hover:text-blue-600"
              >Books</a
            >
            <a href="login.html" class="text-gray-700 hover:text-blue-600"
              >Login</a
            >
          </div>
        </div>
      </div>
    </nav>

    <!-- Borrow Book Form -->
    <main class="flex-grow p-6">
      <div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold mb-6">Borrow a Book</h1>
        <form id="borrowForm" class="space-y-4">
          <input
            type="number"
            id="bookId"
            placeholder="Book ID"
            required
            class="w-full border p-2 rounded"
          />
          <button
            type="submit"
            class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700"
          >
            Borrow
          </button>
        </form>
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white text-center py-4 shadow-inner">
      <p class="text-gray-500 text-sm">© 2025 LibraryMS</p>
    </footer>

    <script>
      const isAuthorized = localStorage.getItem("accessToken") !== null;

      if (!isAuthorized) {
        alert("Unauthorized access. You are being redirected.");
        window.location.href = "login.html";
      }

      document
        .getElementById("borrowForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const bookId = parseInt(e.target.bookId.value);
          const res = await fetch(
            `http://libraryms.runasp.net/api/Transaction/BorrowBook`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ bookId }),
            }
          );
          if (res.ok) alert("Book borrowed successfully");
          else alert("Borrow failed");
        });
    </script>
  </body>
</html>
