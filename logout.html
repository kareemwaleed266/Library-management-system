<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Logout | Library Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- Navbar -->
    <nav class="bg-white shadow-md">
      <div class="max-w-7xl mx-auto px-4">
        <div class="flex justify-between items-center h-16">
          <div class="flex items-center">
            <img
              src="https://cdn-icons-png.flaticon.com/512/3145/3145765.png"
              alt="Logo"
              class="h-10 w-10 mr-2"
            />
            <span class="font-bold text-xl text-blue-600">LibraryMS</span>
          </div>
          <div class="flex space-x-4">
            <a
              href="index.html"
              class="text-gray-700 hover:text-blue-600 font-medium"
              >Home</a
            >
          </div>
        </div>
      </div>
    </nav>

    <!-- Logout Confirmation -->
    <main class="flex-grow p-6">
      <div
        class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-lg text-center"
      >
        <h2 class="text-2xl font-bold text-gray-800 mb-4">
          You have been logged out.
        </h2>
        <p class="text-gray-600 mb-6">
          Thank you for using LibraryMS. See you next time!
        </p>
        <a
          href="login.html"
          class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition"
        >
          Login Again
        </a>
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white text-center py-4 shadow-inner">
      <p class="text-gray-500 text-sm">
        © 2025 LibraryMS. All rights reserved.
      </p>
    </footer>

    <!-- <script>
    // Optional: Redirect to login page after 3 seconds
    setTimeout(() => {
      window.location.href = 'login.html';
    }, 3000);
  </script> -->
    <script src="js/auth.js"></script>
    <script>
      window.onload = async () => {
        const accessToken = localStorage.getItem("accessToken");

        if (!accessToken) {
          alert("Unauthorized access. Redirecting to login...");
          window.location.href = "login.html";
          return;
        }

        try {
          const response = await fetchWithAuth(
            "https://libraryms.runasp.net/api/Account/logout",
            {
              method: "POST",
              // لا تحتاج body أو content-type هنا
            }
          );

          const data = await response.json();
          console.log(data);

          if (response.ok) {
            localStorage.clear();
            alert(data.message || "Logout successful.");
            window.location.href = "login.html";
          } else {
            alert(data.message || "Logout failed. Please try again.");
          }
        } catch (error) {
          console.error("Logout error:", error);
          alert("Error during logout. Please check your connection.");
        }
      };
    </script>
  </body>
</html>
