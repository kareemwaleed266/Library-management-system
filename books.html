<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Books | Library Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- Navbar -->
    <nav class="bg-white shadow-md">
      <div class="max-w-7xl mx-auto px-4">
        <div class="flex justify-between items-center h-16">
          <div class="flex items-center space-x-4">
            <img
              src="https://cdn-icons-png.flaticon.com/512/3145/3145765.png"
              alt="Logo"
              class="h-10 w-10"
            />
            <span class="font-bold text-xl text-blue-600">LibraryMS</span>
          </div>
          <!-- 🔍 Search Bar -->
          <div class="flex-1 mx-4">
            <input
              id="searchInput"
              type="text"
              placeholder="Search books by title..."
              class="w-[50%] mx-auto block px-4 py-2 border rounded-md bg-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
          <div class="flex space-x-4">
            <a
              href="index.html"
              class="text-gray-700 hover:text-blue-600 font-medium"
              >Home</a
            >
            <button
              onclick="logout()"
              class="text-red-600 hover:text-red-800 font-medium"
            >
              Logout
            </button>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow p-6">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-gray-800">All Books</h1>
        <a
          href="add-book.html"
          id="addBookBtn"
          class="hidden bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition"
        >
          Add Book
        </a>
      </div>

      <div
        id="booksContainer"
        class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"
      >
        <!-- Books will be loaded here dynamically -->
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white text-center py-4 shadow-inner">
      <p class="text-gray-500 text-sm">
        © 2025 LibraryMS. All rights reserved.
      </p>
    </footer>

    <!-- Script -->
    <script src="js/auth.js"></script>
    <script>
      const isAuthorized = localStorage.getItem("accessToken") !== null;

      if (!isAuthorized) {
        alert("Unauthorized access. You are being redirected.");
        window.location.href = "login.html";
      }

      const isAdmin = localStorage.getItem("isAdmin") === "true";
      if (isAdmin) {
        document.getElementById("addBookBtn").classList.remove("hidden");
      }

      function logout() {
        window.location.href = "logout.html";
      }

      let allBooks = [];

      async function fetchBooks() {
        try {
          const token = localStorage.getItem("accessToken");
          const response = await fetchWithAuth(
            "https://libraryms.runasp.net/api/Book/GetAllBooksAsync" //0
          );
          const books = await response.json();
          allBooks = books;
          renderBooks(books);
        } catch (error) {
          console.error("Error fetching books:", error);
        }
      }

      function renderBooks(booksToDisplay) {
        const container = document.getElementById("booksContainer");
        container.innerHTML = "";

        booksToDisplay.forEach((book) => {
          const bookCard = document.createElement("div");
          bookCard.className =
            "bg-white p-4 rounded-lg shadow-md flex flex-col";

          bookCard.innerHTML = `
            <h1 class="text-2xl font-bold text-gray-800 mb-4">${book.title}</h1>
            <p class="text-gray-600 mb-2"><strong>Author:</strong> ${book.author}</p>
            <p class="text-gray-600 mb-2"><strong>Category:</strong> ${book.categoryName}</p>
            <p class="text-gray-600 mb-2"><strong>Publisher:</strong> ${book.publisherName}</p>
            <p class="text-gray-600 mb-4"><strong>Price:</strong> $${book.price}</p>

            <div class="mt-auto flex space-x-2" id="buttons-${book.id}">
              <a href="book-details.html?id=${book.id}" class="px-3 py-1 bg-blue-500 text-white rounded hover:bg-blue-600 transition text-sm">View</a>
            </div>
          `;

          if (isAdmin) {
            const buttonsDiv = bookCard.querySelector(`#buttons-${book.id}`);
            buttonsDiv.innerHTML += `
              <a href="update-book.html?id=${book.id}" class="px-3 py-1 bg-green-500 text-white rounded hover:bg-green-600 transition text-sm">Edit</a>
              <button onclick="deleteBook(${book.id})" class="px-3 py-1 bg-red-500 text-white rounded hover:bg-red-600 transition text-sm">Delete</button>
            `;
          }

          container.appendChild(bookCard);
        });
      }

      async function deleteBook(bookId) {
        const confirmDelete = confirm(
          "Are you sure you want to delete this book?"
        );
        if (!confirmDelete) return;

        try {
          const token = localStorage.getItem("accessToken");
          const response = await fetchWithAuth(
            `https://libraryms.runasp.net/api/Book/DeleteBook/${bookId}`,
            {
              method: "DELETE",
            }
          );

          if (response.ok) {
            alert("Book deleted successfully");
            fetchBooks();
          } else {
            const data = await response.json();
            alert(data.message || "Failed to delete the book");
          }
        } catch (error) {
          console.error("Error deleting book:", error);
          alert("An error occurred while deleting the book");
        }
      }

      // 🔍 Search Function
      document
        .getElementById("searchInput")
        .addEventListener("input", function (e) {
          const searchText = e.target.value.toLowerCase();
          const filteredBooks = allBooks.filter((book) =>
            book.title.toLowerCase().includes(searchText)
          );
          renderBooks(filteredBooks);
        });

      fetchBooks();
    </script>
  </body>
</html>
