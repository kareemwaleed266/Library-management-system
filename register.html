<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | Library Management System</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

  <!-- Navbar -->
  <nav class="bg-white shadow-md">
    <div class="max-w-7xl mx-auto px-4">
      <div class="flex justify-between items-center h-16">
        <div class="flex items-center">
          <img src="https://cdn-icons-png.flaticon.com/512/3145/3145765.png"
               alt="Logo" class="h-10 w-10 mr-2">
          <span class="font-bold text-xl text-blue-600">LibraryMS</span>
        </div>
        <div class="flex space-x-4">
          <a href="index.html" class="text-gray-700 hover:text-blue-600 font-medium">Home</a>
          <a href="login.html" class="text-gray-700 hover:text-blue-600 font-medium">Login</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Register Form -->
  <main class="flex-grow p-6">
    <div class="max-w-lg mx-auto bg-white p-8 rounded-lg shadow-lg">
      <h2 class="text-2xl font-bold text-gray-800 mb-6">Create a New Account</h2>
      <form id="registerForm" class="space-y-4">
        <div>
          <label for="username" class="block text-gray-700">Username</label>
          <input type="text" id="username" name="username" required
                 class="w-full p-3 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
        </div>
        <div>
          <label for="email" class="block text-gray-700">Email</label>
          <input type="email" id="email" name="email" required
                 class="w-full p-3 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
        </div>
        <div>
          <label for="password" class="block text-gray-700">Password</label>
          <input type="password" id="password" name="password" required
                 class="w-full p-3 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
        </div>
        <button type="submit"
                class="w-full bg-blue-600 text-white py-3 rounded-md hover:bg-blue-700 transition">
          Register
        </button>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white text-center py-4 shadow-inner">
    <p class="text-gray-500 text-sm">© 2025 LibraryMS. All rights reserved.</p>
  </footer>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async e => {
      e.preventDefault();
      const username = e.target.username.value;
      const email = e.target.email.value;
      const password = e.target.password.value;

      // Basic validation
      if (!username || !email || !password) {
        alert('Please fill in all fields');
        return;
      }

      // Simple email format validation
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        alert('Please enter a valid email');
        return;
      }

      const payload = { username, email, password };
      const res = await fetch('http://libraryms.runasp.net/api/Account/Register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (res.ok) {
        alert('Registration successful!');
        window.location.href = 'login.html';
      } else {
        alert(data.message || 'Registration failed. Please try again.');
      }
    });
  </script>

</body>
</html>
